
<div class="Contenedor-Padre">
  <div class="Info-Header">
    <h1>Información de Contacto</h1>
    <progressbar [value]="value" (change)="onProgressChange(value)">{{value}}%</progressbar>
  </div>
  <div class="Info-Body">
    <div class="Info-Labels">
        <label for="name">Nombre</label>
        <input type="text" id="name" placeholder="Ingresa tu nombre">
        
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" placeholder="Ingresa tu correo electrónico">
        
        <label for="phone">Teléfono</label>
        <input type="tel" id="phone" placeholder="Ingresa tu número de teléfono de Contacto">
        
        <label for="name">Linkedin</label>
        <input type="text" id="name" placeholder="Ingresa tu perfil de Linkedin ej:www.linkedin.com/in/nombreapellido
        ">

        <div class="bottom-info">
          <button (click)="onProgressChange(value)">{{labelSubmit}}</button>
        </div>

      </div>
    <div class="Info-Result">
        <div class="template-data">

        </div>
    </div>
  </div>
</div>
